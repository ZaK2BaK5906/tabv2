<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>MDT Premium</title>
    <!-- CRITICAL: Force transparent BEFORE anything else -->
    <script>
      (function() {
        // Force transparent on html immediately
        document.documentElement.style.cssText = 'background:transparent!important;background-color:transparent!important;';

        // Wait for body to exist then force transparent
        function forceTransparent() {
          if (document.body) {
            document.body.style.cssText = 'background:transparent!important;background-color:transparent!important;margin:0;padding:0;';
            var root = document.getElementById('root');
            if (root) {
              root.style.cssText = 'display:none!important;visibility:hidden!important;opacity:0!important;background:transparent!important;';
            }
          }
        }

        // Run immediately if body exists
        if (document.body) {
          forceTransparent();
        }

        // Also run on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', forceTransparent);

        // Watch for mdt-open class to show UI
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.attributeName === 'class') {
              var root = document.getElementById('root');
              if (document.body.classList.contains('mdt-open')) {
                if (root) root.style.cssText = 'display:flex!important;visibility:visible!important;opacity:1!important;background:transparent!important;height:100%;width:100%;';
              } else {
                if (root) root.style.cssText = 'display:none!important;visibility:hidden!important;opacity:0!important;background:transparent!important;';
                // Also force body transparent when closing
                document.body.style.background = 'transparent';
                document.body.style.backgroundColor = 'transparent';
              }
            }
          });
        });

        // Start observing when body is ready
        function startObserver() {
          if (document.body) {
            observer.observe(document.body, { attributes: true });
          } else {
            requestAnimationFrame(startObserver);
          }
        }
        startObserver();
      })();
    </script>

      /* Critical: Ensure no background and hidden by default */
      html, body {
        background: transparent !important;
        background-color: transparent !important;
        margin: 0;
        padding: 0;
      }
      #root {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        background: transparent !important;
      }
      body.mdt-open #root {
        display: flex !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
    </style>
